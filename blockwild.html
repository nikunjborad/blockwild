<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141a26">
<title>Blockwild</title>
<style>
:root{
  --slab:#1d2434; --slab2:#262f44; --edge:#0a0e16; --ink:#f5efe1; --mute:#a7b0c4; --moss:#7ed957; --moss-d:#3f8f2e;
  --ember:#ff8a3d; --ember-d:#a8471a; --sky:#6fc3ff; --gold:#ffd25a; --hp:#6be06b; --hp-mid:#ffcc3a; --hp-low:#ff5a4a;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#141a26;font-family:var(--font);color:var(--ink);touch-action:none}
canvas#gl{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui > *{pointer-events:auto}
.hidden{display:none !important}
/* carved slab panels */
.slab{background:linear-gradient(180deg,var(--slab2),var(--slab));border:3px solid var(--edge);border-radius:10px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.12), inset 0 -4px 0 rgba(0,0,0,.35), 0 6px 0 rgba(0,0,0,.35);}
.btn{font:800 16px/1.1 var(--font);color:var(--ink);background:linear-gradient(180deg,#36415c,#2a3349);border:3px solid var(--edge);border-radius:9px;
  padding:12px 14px;box-shadow:inset 0 3px 0 rgba(255,255,255,.14), inset 0 -4px 0 rgba(0,0,0,.35);cursor:pointer;text-align:left;outline:none;position:relative}
.btn:active,.btn.press{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.35)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.45}
.btn.primary{background:linear-gradient(180deg,#8fe466,#5fbf3f);color:#13260c}
.btn.warn{background:linear-gradient(180deg,#ff9f5a,#e2702c);color:#2a1206}
.tag{display:inline-block;font:800 11px/1 var(--font);padding:4px 7px 3px;border-radius:6px;border:2px solid rgba(0,0,0,.45);color:#141414;letter-spacing:.02em}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none}
#zoneToast{position:absolute;left:14px;top:calc(14px + var(--safe-t));padding:10px 16px;font:800 17px var(--font);transform:translateY(-120%);transition:transform .5s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#zoneToast.show{transform:translateY(0)}
#menuBtn{position:absolute;right:12px;top:calc(12px + var(--safe-t));width:52px;height:52px;padding:0;display:grid;place-items:center;pointer-events:auto}
#menuBtn i{display:block;width:22px;height:4px;background:var(--ink);border-radius:2px;box-shadow:0 7px 0 var(--ink),0 -7px 0 var(--ink)}
#coinHud{position:absolute;right:72px;top:calc(18px + var(--safe-t));font:800 15px var(--font);padding:8px 12px;pointer-events:none}
#coinHud b{color:var(--gold)}
/* controls */
#controls{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none}
#dpad{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + var(--safe-b));width:168px;height:168px;pointer-events:auto;touch-action:none}
#dpad .k{position:absolute;width:56px;height:56px;background:linear-gradient(180deg,#3a4560,#2a3349);border:3px solid var(--edge);border-radius:10px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.14), inset 0 -4px 0 rgba(0,0,0,.4);opacity:.88}
#dpad .k.on{transform:translateY(2px);background:linear-gradient(180deg,#5a6a8e,#3e4a68)}
#dpad .k::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border:9px solid transparent;transform:translate(-50%,-50%)}
#dpad .u{left:56px;top:0} #dpad .u::after{border-bottom-color:var(--ink);margin-top:-5px}
#dpad .d{left:56px;top:112px} #dpad .d::after{border-top-color:var(--ink);margin-top:5px}
#dpad .l{left:0;top:56px} #dpad .l::after{border-right-color:var(--ink);margin-left:-5px}
#dpad .r{left:112px;top:56px} #dpad .r::after{border-left-color:var(--ink);margin-left:5px}
#dpad .c{left:56px;top:56px;background:#222a3d;box-shadow:none}
#abtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(30px + var(--safe-b));width:160px;height:150px;pointer-events:none}
.gem{position:absolute;width:74px;height:74px;border-radius:18px;border:3px solid var(--edge);font:900 26px var(--font);display:grid;place-items:center;pointer-events:auto;touch-action:none;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.3), inset 0 -6px 0 rgba(0,0,0,.3), 0 5px 0 rgba(0,0,0,.35);opacity:.92}
.gem.on{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.2), inset 0 -3px 0 rgba(0,0,0,.3)}
#btnA{right:0;top:0;background:linear-gradient(180deg,#9aec6e,#5fbf3f);color:#16300c}
#btnB{right:84px;top:62px;background:linear-gradient(180deg,#ffa767,#e2702c);color:#341406}
/* dialog */
#dlg{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--safe-b));max-width:720px;margin:0 auto;padding:18px 20px 20px;min-height:110px;font:700 18px/1.42 var(--font)}
#dlg .who{position:absolute;left:16px;top:-18px;padding:5px 12px;font:800 14px var(--font);background:var(--gold);color:#2a1e00;border:3px solid var(--edge);border-radius:8px}
#dlg .more{position:absolute;right:16px;bottom:10px;width:0;height:0;border:8px solid transparent;border-top-color:var(--gold);animation:bob .8s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#choices{position:absolute;right:16px;bottom:calc(150px + var(--safe-b));display:flex;flex-direction:column;gap:8px;min-width:150px}
/* battle */
#battle{position:absolute;inset:0;pointer-events:none}
#battle .card{position:absolute;padding:10px 12px 10px;min-width:210px;max-width:62vw;pointer-events:none}
#foeCard{left:10px;top:calc(12px + var(--safe-t))}
#myCard{right:10px}
.card .row1{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.card .nm{font:900 18px var(--font)}
.card .lv{font:800 14px var(--font);color:var(--mute)}
.card .tys{display:flex;gap:4px;margin-top:5px}
.hpbar{margin-top:7px;height:12px;background:#0d1220;border:2px solid var(--edge);border-radius:6px;overflow:hidden;position:relative}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp);border-radius:3px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.hpnum{font:800 13px var(--font);color:var(--mute);text-align:right;margin-top:4px}
.xpbar{margin-top:5px;height:6px;background:#0d1220;border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sky)}
#bpanel{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + var(--safe-b));pointer-events:auto}
#bpanel .inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#bmsg{padding:14px 18px;font:700 18px/1.38 var(--font);min-height:76px}
#bacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#bacts .btn{min-height:58px;font-size:18px}
.mv{display:flex;flex-direction:column;gap:4px}
.mv small{font:700 12px var(--font);opacity:.85}
.mv .tag{align-self:flex-start}
/* overlays */
#sheet{position:absolute;inset:0;background:rgba(8,11,18,.55);display:flex;align-items:flex-end;justify-content:center;padding:calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b))}
#sheet .panel{width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#sheet .head{display:flex;gap:6px;padding:10px;align-items:center;border-bottom:3px solid var(--edge)}
#sheet .head .btn{padding:9px 12px;font-size:15px}
#sheet .head .btn.sel{background:linear-gradient(180deg,#ffe07a,#f0b83a);color:#2a1e00}
#sheet .head .x{margin-left:auto}
#sheet .body{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.mrow{display:flex;align-items:center;gap:12px;width:100%}
.mrow img{width:64px;height:64px;image-rendering:auto;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.mrow .mid{flex:1;min-width:0}
.mrow .nm{font:900 17px var(--font)} .mrow .sub{font:700 13px var(--font);color:var(--mute)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dexc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;text-align:center}
.dexc img{width:76px;height:76px}
.dexc .nm{font:800 13px var(--font)}
.dexc.unseen img{filter:brightness(0) opacity(.35)}
.dexc.seen img{filter:brightness(0) opacity(.75)}
.statgrid{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font:800 14px var(--font)}
.statgrid .bar{height:8px;background:#0d1220;border-radius:4px;overflow:hidden}.statgrid .bar i{display:block;height:100%;background:var(--sky)}
.desc{font:700 15px/1.45 var(--font);color:#d9d2c2;max-width:60ch}
.note{font:700 13px var(--font);color:var(--mute)}
/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 20px calc(40px + var(--safe-b));gap:12px;background:radial-gradient(ellipse 90% 30% at 50% 22%,rgba(10,14,22,.38),rgba(10,14,22,0) 70%),linear-gradient(180deg,rgba(10,14,22,0) 45%,rgba(10,14,22,.55))}
#title .btn{width:min(320px,80vw);text-align:center;font-size:19px;padding:15px}
#title .tagline{font:800 16px var(--font);color:#e8f0ff;text-shadow:0 2px 0 rgba(0,0,0,.6);margin-bottom:8px;text-align:center}
#title .ver{font:700 12px var(--font);color:rgba(255,255,255,.55)}
/* starter */
#starter{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 12px calc(16px + var(--safe-b));pointer-events:none}
#starter .panel{width:100%;max-width:560px;padding:16px;pointer-events:auto;display:flex;flex-direction:column;gap:10px}
#starter .nav{display:flex;gap:10px;align-items:center}
#starter .nav .btn{flex:none;width:58px;text-align:center;font-size:22px}
#starter .info{flex:1;text-align:center}
#starter .info .nm{font:900 26px var(--font)}
/* wipe */
#wipe{position:absolute;inset:0;display:grid;pointer-events:none;z-index:50}
#wipe i{background:#0a0e16;transform:scale(0);transition:transform .32s ease-in}
#wipe.on i{transform:scale(1.04)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:49;transition:opacity .25s}
.bubble{position:absolute;transform:translate(-50%,-100%);font:900 26px var(--font);color:#2a1e00;background:var(--gold);border:3px solid var(--edge);border-radius:10px;padding:2px 12px;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.2)}}
#toast{position:absolute;left:50%;top:calc(80px + var(--safe-t));transform:translateX(-50%);padding:10px 16px;font:800 15px var(--font);pointer-events:none;transition:opacity .3s;opacity:0}
#toast.show{opacity:1}
#evo{position:absolute;inset:0;pointer-events:none}
body.talking #controls, body.talking #menuBtn{visibility:hidden}
@media (prefers-reduced-motion: reduce){ #zoneToast{transition:none} .bubble{animation:none} #wipe i{transition:none} }
@media (min-aspect-ratio: 1/1){ #bpanel .inner{flex-direction:row;align-items:stretch} #bmsg{flex:1} #bacts{flex:1.2} #dlg{left:220px;right:220px} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div id="zoneToast" class="slab"></div>
    <div id="coinHud" class="slab hidden"></div>
    <button id="menuBtn" class="btn" aria-label="Menu"><i></i></button>
  </div>
  <div id="controls" class="hidden">
    <div id="dpad"><div class="k u" data-d="up"></div><div class="k l" data-d="left"></div><div class="k c"></div><div class="k r" data-d="right"></div><div class="k d" data-d="down"></div></div>
    <div id="abtns"><div id="btnA" class="gem">A</div><div id="btnB" class="gem">B</div></div>
  </div>
  <div id="bubbles" style="position:absolute;inset:0;pointer-events:none"></div>
  <div id="battle" class="hidden">
    <div id="foeCard" class="card slab"></div>
    <div id="myCard" class="card slab"></div>
    <div id="bpanel"><div class="inner"><div id="bmsg" class="slab"></div><div id="bacts"></div></div></div>
  </div>
  <div id="starter" class="hidden"><div class="panel slab"></div></div>
  <div id="dlg" class="slab hidden"><span class="who"></span><span class="txt"></span><span class="more"></span></div>
  <div id="choices" class="hidden"></div>
  <div id="sheet" class="hidden"><div class="panel slab"><div class="head"></div><div class="body"></div></div></div>
  <div id="title" class="hidden"></div>
  <div id="toast" class="slab"></div>
  <div id="flash"></div>
  <div id="wipe"></div>
</div>
<script>
'use strict';
// ===== Math helpers (column-major mat4) =====
const M4 = {
  id() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  copy(a) { return new Float32Array(a); },
  mul(a, b, o) {
    o = o || new Float32Array(16);
    const r = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let rr = 0; rr < 4; rr++) {
      r[c * 4 + rr] = a[rr] * b[c * 4] + a[4 + rr] * b[c * 4 + 1] + a[8 + rr] * b[c * 4 + 2] + a[12 + rr] * b[c * 4 + 3];
    }
    o.set(r); return o;
  },
  persp(fov, asp, n, f) {
    const t = 1 / Math.tan(fov / 2), m = new Float32Array(16);
    m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m;
  },
  ortho(l, r, b, t, n, f) {
    const m = new Float32Array(16);
    m[0] = 2 / (r - l); m[5] = 2 / (t - b); m[10] = -2 / (f - n);
    m[12] = -(r + l) / (r - l); m[13] = -(t + b) / (t - b); m[14] = -(f + n) / (f - n); m[15] = 1; return m;
  },
  lookAt(e, c, u) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    const m = new Float32Array(16);
    m[0] = xx; m[1] = yx; m[2] = zx; m[4] = xy; m[5] = yy; m[6] = zy; m[8] = xz; m[9] = yz; m[10] = zz;
    m[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
    m[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
    m[14] = -(zx * e[0] + zy * e[1] + zz * e[2]); m[15] = 1; return m;
  },
  translate(m, x, y, z) {
    m[12] += m[0] * x + m[4] * y + m[8] * z; m[13] += m[1] * x + m[5] * y + m[9] * z;
    m[14] += m[2] * x + m[6] * y + m[10] * z; m[15] += m[3] * x + m[7] * y + m[11] * z; return m;
  },
  rotY(m, a) {
    if (!a) return m; const c = Math.cos(a), s = Math.sin(a);
    for (let i = 0; i < 4; i++) { const a0 = m[i], a2 = m[8 + i]; m[i] = a0 * c - a2 * s; m[8 + i] = a0 * s + a2 * c; } return m;
  },
  rotX(m, a) {
    if (!a) return m; const c = Math.cos(a), s = Math.sin(a);
    for (let i = 0; i < 4; i++) { const a1 = m[4 + i], a2 = m[8 + i]; m[4 + i] = a1 * c + a2 * s; m[8 + i] = -a1 * s + a2 * c; } return m;
  },
  rotZ(m, a) {
    if (!a) return m; const c = Math.cos(a), s = Math.sin(a);
    for (let i = 0; i < 4; i++) { const a0 = m[i], a1 = m[4 + i]; m[i] = a0 * c + a1 * s; m[4 + i] = -a0 * s + a1 * c; } return m;
  },
  scale(m, x, y, z) {
    if (y === undefined) { y = x; z = x; }
    for (let i = 0; i < 4; i++) { m[i] *= x; m[4 + i] *= y; m[8 + i] *= z; } return m;
  },
  invert(a) {
    const o = new Float32Array(16);
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3], a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7],
      a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11], a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11,
      b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12, b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30,
      b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
    if (!det) return M4.id(); det = 1 / det;
    o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det; o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
    o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det; o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
    o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det; o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
    o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det; o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
    o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det; o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
    o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det; o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
    o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
    o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det; o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    return o;
  }
};

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, z, s = 0) {
  let h = (x * 374761393 + z * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
function hash3(x, y, z) { return hash2(x * 7 + y * 131, z * 13 - y * 17, y); }
function vnoise(x, z, s = 0) {
  const ix = Math.floor(x), iz = Math.floor(z); let fx = x - ix, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz, s), b = hash2(ix + 1, iz, s), c = hash2(ix, iz + 1, s), d = hash2(ix + 1, iz + 1, s);
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}
function fbm(x, z, s = 0) { return vnoise(x, z, s) * 0.55 + vnoise(x * 2.1, z * 2.1, s + 9) * 0.3 + vnoise(x * 4.3, z * 4.3, s + 21) * 0.15; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function compile(vs, fs) {

    gl.attachShader(p, s);

// ----- Mesh builder -----
class MB {
  constructor() { this.v = []; this.i = []; this.n = 0; }
  // quad with 4 corners (ccw when viewed from outside), per-corner ao
  quad(a, b, c, d, nrm, col, ao, mat, part) {
    const cs = [a, b, c, d];
    for (let k = 0; k < 4; k++) {
      const p = cs[k], cc = Array.isArray(col[0]) ? col[k] : col;
      this.v.push(p[0], p[1], p[2], nrm[0], nrm[1], nrm[2], cc[0], cc[1], cc[2], ao[k], mat[0] * (mat[4] ? mat[4][k] : 1), mat[1], mat[2], part);

    const n = this.n;
    if (ao[0] + ao[2] < ao[1] + ao[3]) this.i.push(n + 1, n + 2, n + 3, n + 1, n + 3, n);
    else this.i.push(n, n + 1, n + 2, n, n + 2, n + 3);
    this.n += 4;
  }
  // axis-aligned box from (x0,y0,z0) to (x1,y1,z1)
  box(x0, y0, z0, x1, y1, z1, col, o = {}) {
    const c = hexRGB(col), part = o.part || 0, grain = o.grain ?? 0.5, emit = o.emit || 0, sway = o.sway || 0;
    const bot = o.bot ?? 0.72, side = o.noSideShade ? 1 : 1;
    const cTop = o.top ? hexRGB(o.top) : c;
    const mt = [sway, grain, emit, 0, null];
    const swayB = sway ? [0, 0, 1, 1] : null;
    const aoS = [bot, bot, 1, 1];
    // +Y
    this.quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], [0, 1, 0], cTop, [1, 1, 1, 1], [sway, grain, emit, 0, null], part);
    // -Y
    this.quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0], c, [bot, bot, bot, bot], [0, grain, emit, 0, null], part);
    // +Z
    this.quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], [0, 0, 1], c, aoS, [sway, grain, emit, 0, swayB], part);
    // -Z
    this.quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [0, 0, -1], c, aoS, [sway, grain, emit, 0, swayB], part);
    // +X
    this.quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [1, 0, 0], c, aoS, [sway, grain, emit, 0, swayB], part);
    // -X
    this.quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [-1, 0, 0], c, aoS, [sway, grain, emit, 0, swayB], part);

  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, vf, gl.STATIC_DRAW);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, S, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, S, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, S, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, S, 36);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 1, gl.FLOAT, false, S, 52);
  gl.bindVertexArray(null);
  return { vao, vb, ib, count: idx.length, type: idx instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };

const _pm = new Float32Array(128);
function animParts(md, t, mv, extra = {}) {
  const out = _pm; out.set(IDP);
  const P = md.piv;
  const set = (i, rx, ry, rz, tx = 0, ty = 0, tz = 0, s = 1) => {
    const p = P[i] || [0, 0, 0]; const m = M4.id();
    M4.translate(m, (p[0] + tx) * VU, (p[1] + ty) * VU, (p[2] + tz) * VU); M4.rotY(m, ry); M4.rotX(m, rx); M4.rotZ(m, rz);
    if (s !== 1) M4.scale(m, s); M4.translate(m, -p[0] * VU, -p[1] * VU, -p[2] * VU); out.set(m, i * 16);
  };
  const w = (extra.phase ?? t * 9), a = mv ? 1 : 0, S = Math.sin(w), breath = Math.sin(t * 2.2);
  const look = extra.look || 0;
  switch (md.anim) {
    case 'quad':
      set(3, S * 0.75 * a, 0, 0); set(6, S * 0.75 * a, 0, 0); set(4, -S * 0.75 * a, 0, 0); set(5, -S * 0.75 * a, 0, 0);
      set(1, breath * 0.04 + (mv ? Math.sin(w * 2) * 0.05 : 0), look + Math.sin(t * 0.7) * 0.12 * (1 - a), 0);
      set(2, 0, Math.sin(t * 5) * 0.45, 0); set(7, 0, 0, Math.sin(t * 13) * 0.06, 0, Math.sin(t * 17) * 0.25, 0, 1 + Math.sin(t * 21) * 0.08); break;
    case 'biped':
      set(5, S * 0.8 * a, 0, 0); set(6, -S * 0.8 * a, 0, 0);
      set(3, -S * 0.7 * a + (extra.wave ? -2.4 + Math.sin(t * 12) * 0.3 : 0), 0, -0.06 - breath * 0.03); set(4, S * 0.7 * a, 0, 0.06 + breath * 0.03);
      set(1, breath * 0.03, look + Math.sin(t * 0.6) * 0.1 * (1 - a), 0); break;
    case 'bird': {
      const fl = mv ? Math.sin(t * 16) * 0.7 : Math.max(0, Math.sin(t * 2.5)) * 0.25;
      set(3, 0, 0, -fl - 0.1); set(4, 0, 0, fl + 0.1); set(5, S * 0.6 * a, 0, 0); set(6, -S * 0.6 * a, 0, 0);
      set(1, Math.sin(t * 3) * 0.06, look + Math.sin(t * 1.3) * 0.2, 0); set(2, Math.sin(t * 4) * 0.15, 0, 0); break; }
    case 'float': {
      const fl = Math.sin(t * 24) * 0.75; set(3, 0, 0, -fl); set(4, 0, 0, fl);
      set(7, 0, 0, Math.sin(t * 9) * 0.12, 0, 0, 0, 1 + Math.sin(t * 19) * 0.1); set(1, Math.sin(t * 2) * 0.08, look, 0); break; }
    case 'seal':
      set(3, 0, 0, -0.2 - Math.sin(w) * 0.5 * a - breath * 0.08); set(4, 0, 0, 0.2 + Math.sin(w) * 0.5 * a + breath * 0.08);
      set(2, Math.sin(t * 4) * 0.25, Math.sin(t * 2) * 0.2, 0); set(1, breath * 0.06 - (mv ? Math.abs(S) * 0.12 : 0), look + Math.sin(t * 0.8) * 0.15, 0);
      set(7, 0, 0, Math.sin(t * 3) * 0.1); break;
    case 'hop':
      set(5, (mv ? -Math.abs(S) * 0.8 : 0), 0, 0); set(6, (mv ? -Math.abs(S) * 0.8 : 0), 0, 0); set(3, mv ? S * 0.5 : 0, 0, 0); set(4, mv ? S * 0.5 : 0, 0, 0);
      set(1, breath * 0.05, look + Math.sin(t * 0.9) * 0.12, Math.sin(t * 1.7) * 0.05); set(2, 0, Math.sin(t * 6) * 0.3, 0); break;
  }

}
function rootBob(md, t, mv, phase) {
  const w = phase ?? t * 9;
  switch (md.anim) {
    case 'float': return { y: md.hover + Math.sin(t * 2.6) * 0.06, sy: 1 };
    case 'hop': return mv ? { y: Math.abs(Math.sin(w)) * 0.18, sy: 1 + Math.sin(w * 2) * 0.06 } : { y: 0, sy: 1 + Math.sin(t * 2.2) * 0.025 };
    case 'bird': return mv ? { y: Math.abs(Math.sin(w)) * 0.12, sy: 1 } : { y: 0, sy: 1 + Math.sin(t * 2.2) * 0.02 };
    case 'seal': return mv ? { y: Math.abs(Math.sin(w)) * 0.06, sy: 1 - Math.abs(Math.sin(w)) * 0.06 } : { y: 0, sy: 1 + Math.sin(t * 2.2) * 0.03 };
    case 'biped': return { y: mv ? Math.abs(Math.sin(w)) * 0.05 : 0, sy: 1 + Math.sin(t * 2.2) * 0.012 };
    default: return { y: mv ? Math.abs(Math.sin(w)) * 0.04 : 0, sy: 1 + Math.sin(t * 2.2) * 0.02 };
  }
}

}

const WORLD = { W: 64, D: 88, H: 22 };

    if (z >= 62) return 0; // village

  }

    if (zn === 2) return z >= 48 ? 3 : z >= 40 ? (x < 47 ? 4 : 3) : (x < 47 ? 5 : 3);
    if (zn === 3) return 6;

  for (const [x, z] of [[29, 66], [33, 68], [27, 73], [35, 77], [29, 78], [25, 69], [42, 70]]) if (getT(x, z) !== T.WALL) { prop(x, z, 'lamp'); addDeco(g, decoLampPost(x, z, ht[I(x, z)])); }

    const i = I(x, z), t = tile[i], h = ht[i]; const rr = mulberry(i * 7 + 3);

const $ = s => document.querySelector(s);

// ---------- Input ----------
const Input = { dir: null, keys: new Set(), dpadDir: null, run: false, listeners: [], bHeld: false };
const KEYDIR = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
function emitBtn(b) { const ls = Input.listeners.slice(); for (const f of ls) if (f(b) === true) break; }
function onBtn(f) { Input.listeners.unshift(f); return () => { const i = Input.listeners.indexOf(f); if (i >= 0) Input.listeners.splice(i, 1); }; }
function waitBtn(which) { return new Promise(res => { const off = onBtn(b => { if (!which || which.includes(b)) { off(); res(b); return true; } }); }); }
function recomputeDir() {
  let d = Input.dpadDir;
  if (!d) { for (const k of [...Input.keys].reverse()) if (KEYDIR[k]) { d = KEYDIR[k]; break; } }
  Input.dir = d;
}
window.addEventListener('keydown', e => {
  if (e.repeat && !KEYDIR[e.code]) return;
  Audio2.unlock();
  Input.keys.add(e.code); recomputeDir();
  if (e.code === 'KeyZ' || e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); if (!navKey('ok')) emitBtn('a'); }
  else if (e.code === 'KeyX' || e.code === 'Escape' || e.code === 'Backspace') { e.preventDefault(); Input.bHeld = true; if (!navKey('back')) emitBtn('b'); }
  else if (e.code === 'KeyC' || e.code === 'Tab') { e.preventDefault(); emitBtn('menu'); }
  else if (KEYDIR[e.code]) { if (navKey(KEYDIR[e.code])) e.preventDefault(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') Input.run = true;
});
window.addEventListener('keyup', e => { Input.keys.delete(e.code); recomputeDir(); if (e.code === 'KeyX' || e.code === 'Escape') Input.bHeld = false; if (e.code.startsWith('Shift')) Input.run = false; });
window.addEventListener('blur', () => { Input.keys.clear(); Input.dpadDir = null; recomputeDir(); });
// D-pad: track a single pointer, pick direction by angle from center
(() => {
  const pad = $('#dpad'); let pid = null;
  const keys = [...pad.querySelectorAll('.k[data-d]')];
  function upd(e) {
    const r = pad.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    let d = null; if (Math.hypot(dx, dy) > 14) d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    Input.dpadDir = d; recomputeDir(); keys.forEach(k => k.classList.toggle('on', k.dataset.d === d));
  }
  pad.addEventListener('pointerdown', e => { Audio2.unlock(); pid = e.pointerId; pad.setPointerCapture(pid); upd(e); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) upd(e); });
  const end = e => { if (e.pointerId !== pid) return; pid = null; Input.dpadDir = null; recomputeDir(); keys.forEach(k => k.classList.remove('on')); };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  for (const [id, b] of [['#btnA', 'a'], ['#btnB', 'b']]) {
    const e = $(id);
    e.addEventListener('pointerdown', ev => { Audio2.unlock(); ev.preventDefault(); e.classList.add('on'); if (b === 'b') Input.bHeld = true; emitBtn(b); });
    const up = () => { e.classList.remove('on'); if (b === 'b') Input.bHeld = false; };
    e.addEventListener('pointerup', up); e.addEventListener('pointercancel', up); e.addEventListener('pointerleave', up);
  }
  $('#menuBtn').addEventListener('click', () => { Audio2.unlock(); emitBtn('menu'); });
})();
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// keyboard navigation of visible button groups
function activeNavRoot() {
  for (const s of ['#choices', '#sheet', '#bacts', '#starter', '#title']) { const e = $(s); if (e && !e.classList.contains('hidden') && e.offsetParent !== null && e.querySelector('.btn:not([disabled])')) return e; }
  return null;
}
function navKey(k) {
  const root = activeNavRoot(); if (!root) return false;
  if (!$('#dlg').classList.contains('hidden') && root.id !== 'choices') return false;
  const btns = [...root.querySelectorAll('.btn:not([disabled])')].filter(b => b.offsetParent !== null);
  if (!btns.length) return false;
  let i = btns.indexOf(document.activeElement);
  if (k === 'ok') { if (i >= 0) { btns[i].click(); return true; } return false; }
  if (k === 'back') { const bk = root.querySelector('[data-back]'); if (bk) { bk.click(); return true; } return false; }
  const step = (k === 'down' || k === 'right') ? 1 : -1;
  i = i < 0 ? 0 : (i + step + btns.length) % btns.length; btns[i].focus(); return true;
}

function renderWorldStatic(t, center) {

  if (SHADOW.on) { computeLightVP(center, 30); beginDepth(); for (const ch of world.chunks) if (Math.hypot(ch.cx - center[0], ch.cz - center[2]) < 40) drawDepth(ch.mesh); endDepth(); }
  gl.viewport(0, 0, canvas.width, canvas.height);
  const f = R.env.fogL.map(v => Math.pow(v, 1 / 2.2)); gl.clearColor(f[0], f[1], f[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); R.cutOn = 0;
  beginLit(); gl.uniform1f(PROG.lit.u.u_cutOn, 0);
  for (const ch of world.chunks) if (Math.hypot(ch.cx - center[0], ch.cz - center[2]) < 52) drawMesh(ch.mesh);
  for (const e of ents) if (e.visible && e.kind !== 'follower') { const m = entMatrices(e, t); drawMesh(m.md.mesh, m.M, m.parts, { grain: 16, rim: [0.15, 0.03, 0] }); }
  resetLitOpts(); drawWater(world.water); drawParticles();
}

// ===== Title screen =====
function showTitle() {
  SCENE.mode = 'title'; OW.active = false; Music.play('village');
  const tt = $('#title'); tt.classList.remove('hidden'); const save = readSave();
  tt.innerHTML = `<div class="tagline">Catch, train and explore a world built block by block.</div>`;
  if (save) {
    const g = save.G; const c = Object.keys(g.caught || {}).length;
    const b = el('button', 'btn primary', `Continue<div style="font:700 13px var(--font);opacity:.8;margin-top:4px">${c} caught · ${fmtTime(g.playtime || 0)} played</div>`);
    b.onclick = () => { Audio2.unlock(); Sfx.select(); startGame(save); }; tt.appendChild(b);
  }
  const nb = el('button', 'btn' + (save ? '' : ' primary'), 'New game');
  nb.onclick = async () => {
    Audio2.unlock(); Sfx.select();
    if (save) { const r = await ask('', 'Start over? Your saved progress will be replaced the next time you save.', ['Start a new game', 'Keep my save']); if (r !== 0) return; }
    startGame(null);
  };
  tt.appendChild(nb);
  tt.appendChild(el('div', 'ver', 'Best played full screen — add it to your home screen'));
  setTimeout(() => { const f = tt.querySelector('.btn'); if (f) f.focus(); }, 50);
}
async function startGame(save) {
  await wipeIn();
  $('#title').classList.add('hidden');
  if (save) Object.assign(G, JSON.parse(JSON.stringify(save.G)));
  else {
    Object.assign(G, { party: [], storage: [], bag: {}, coins: 500, flags: {}, seen: {}, caught: {}, beaten: {}, pos: { x: 19, z: 71, face: 'down' }, lastRest: 'rest1', playtime: 0 });
  }
  if (!G.flags.intro) { G.party = []; G.storage = []; G.flags = {}; G.pos = { x: 19, z: 71, face: 'down' }; }
  spawnNPCs();
  SCENE.mode = 'world';
  $('#hud').classList.remove('hidden'); $('#controls').classList.remove('hidden');
  onZoneSnap(); worldCamera(0, true); OW.active = true;
  await wipeOut();
  zoneToast(ZONES[OW.lastZone].n);
  if (!G.flags.intro) runScript(introScene);
}

// ===== Main loop =====
let lastT = performance.now(), TT = 0, fpsAcc = 0, fpsN = 0, FPS = 60, DT_MAX = /[?&]lowres/.test(location.search) ? 0.6 : 0.05;
function frame(now) {
  const raw = Math.max(0, (now - lastT) / 1000); const dt = Math.min(DT_MAX, raw); lastT = now; TT += dt;
  fpsAcc += raw; fpsN++; if (fpsAcc > 1) { FPS = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  try {
    updateTweens(dt); updateParticles(dt); updateEnv(dt);
    if (SCENE.mode === 'world') { updateOverworld(dt); worldCamera(dt); renderWorld(TT); G.playtime += dt; }
    else if (SCENE.mode === 'battle') { renderBattle(TT); updateBars(); }
    else if (SCENE.mode === 'showcase') renderShowcase(TT);
    else if (SCENE.mode === 'title') renderTitle(TT);
  } catch (e) { console.error(e); window.__lastErr = String(e && e.stack || e); }
  requestAnimationFrame(frame);
}

// ===== Boot =====
function boot() {
  loadSettings(); R.quality = Settings.quality;
  resize(); setupPortraitFBO();
  if (Settings.quality === 'low') SHADOW.on = false; else setupShadow(Settings.quality === 'high' ? 2048 : 1024);
  initWorld(); buildLogo();
  for (const k of Object.keys(PEOPLE)) getModel(k); for (const k of DEX_ORDER) getModel(k); getModel('cube'); getModel('prism'); getModel('boulder');
  buildPortraits();
  setEnv('day', true);
  G.pos = { x: 19, z: 71, face: 'down' }; spawnNPCs();
  showTitle();
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (document.hidden && SCENE.mode === 'world' && OW.active && !OW.busy) saveGame(true); });
  window.addEventListener('resize', () => { if (BT.active) layoutCards(); });
}
window.__bw = { G, ents, OW, BT, SCENE, world, startBattle, makeMon, tileAt, htAt, bfs, get player() { return player; }, get follower() { return follower; }, get fps() { return FPS; }, set dtMax(v) { DT_MAX = v; }, saveGame, readSave, Settings, applyQuality, TRAINERS };
try { boot(); } catch (e) { console.error(e); document.body.insertAdjacentHTML('beforeend', `<pre style="position:fixed;left:0;top:0;color:#fff;background:#000a;padding:10px;white-space:pre-wrap;z-index:99">${String(e.stack || e)}</pre>`); }

</script>
